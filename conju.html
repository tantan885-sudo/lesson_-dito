  c.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(busy)return;busy=true;const ok=b.textContent==cur.ans;b.classList.add(ok?'ok':'no');if(!ok)c.querySelectorAll('.opt').forEach(x=>{if(x.textContent==cur.ans)x.classList.add('ok')});result(ok,ok?'Correct!':'The answer is: '+cur.full,0,b.textContent)})}
 else{c.innerHTML=head(cur)+pre+`<div class="fb" id="fb" style="font-size:1.6rem"></div><button class="btn" id="flip">Show answer</button>`;
  $('flip').onclick=()=>{$('fb').textContent=cur.full;$('flip').outerHTML=`<div class="row2"><button class="btn alt" id="again">Again</button><button class="btn" id="knew">I knew it</button></div>`;$('again').onclick=()=>result(false,'',1,'');$('knew').onclick=()=>result(true,'',1,'')}}}
function checkType(){if(busy)return;const v=$('inp').value;if(!v.trim())return;busy=true;
 const ok=vars(cur.ans).some(a=>norm(a)==norm(v));const fb=vars(cur.ans).some(a=>flat(a)==flat(v));
 result(ok,ok?'Correct!':(fb?'Watch the accents: ':'Not quite: ')+cur.full,0,v)}
function result(ok,msg,fast,your){const fbx=$('fb');if(!fast){fbx.className='fb '+(ok?'ok':'no');fbx.textContent=msg}
 if(!cur.tries){ok?right++:wrong++;log.push({l:cur.v.infinitive+' · '+cur.t.label,full:cur.full,ok:ok,y:your||''})}
 if(!ok){cur.tries++;Q.splice(Math.min(3,Q.length),0,cur)}
 if(ok)done++;
 if(fast){next();return}
 const b=document.createElement('button');b.className='btn';b.textContent='Next';b.onclick=next;$('card').appendChild(b);b.focus();
 document.onkeydown=e=>{if(e.key=='Enter'&&document.body.contains(b)){e.preventDefault();document.onkeydown=null;next()}}}
function finish(){$('play').classList.add('hide');const e=$('end');e.classList.remove('hide');const pct=Math.round(right/N*100);saveH({t:Date.now(),m:S.mode,r:right,n:N});
 e.innerHTML=`<div class="big">${right} / ${N}</div><p style="text-align:center;margin:0 0 14px">${pct}% ${pct>=90?'🎉':pct>=60?'👍':'💪'}</p><div class="row2"><div class="stat">✓ ${right} correct</div><div class="stat no">✗ ${wrong} wrong</div></div><h3>Review (first try)</h3>`+log.map(l=>`<div class="miss ${l.ok?'g':''}"><b>${l.ok?'✓':'✗'}</b> ${l.l}: <b>${l.full}</b>${!l.ok&&l.y?` <span style="color:var(--mut)">(you: ${esc(l.y)})</span>`:''}</div>`).join('')+`<button class="btn" id="again2">Practice again</button><button class="btn alt" id="menu2">Menu</button>`;
 $('again2').onclick=start;$('menu2').onclick=()=>{e.classList.add('hide');$('setup').classList.remove('hide');hist()}}
$('start').onclick=start;$('quit').onclick=()=>{document.onkeydown=null;$('play').classList.add('hide');$('setup').classList.remove('hide');hist()};
document.addEventListener('keydown',e=>{
 if(e.altKey||e.ctrlKey||e.metaKey)return;
 if(e.code==='Space'&&!$('setup').classList.contains('hide')){e.preventDefault();start()}
 if(e.key==='Enter'&&!$('play').classList.contains('hide')&&S.mode==='type'&&!busy){e.preventDefault();checkType()}
});
setup();hist();
</script></body></html>
